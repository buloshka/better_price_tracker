{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block body %}
<div class="form-container">
    <h2 class="form-title">Create an Account</h2>
    <p class="form-subtitle">Get started with your free account</p>

    <div id="error-message"></div>

    <form>
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••" required>
                <button type="button" id="password-toggle" class="password-toggle-btn" tabindex="-1">
                    <svg id="eye-icon" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    <svg id="eye-slash-icon" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="display: none;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.243L9.88 9.88" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="telegram_id">Telegram ID <span class="label-optional">(Optional)</span></label>
            <input type="text" id="telegram_id" name="telegram_id" class="form-control" placeholder="123456789">
            <span class="field-hint">Required if you want to receive instant notifications.</span>
        </div>

        <button
                type="submit"
                class="btn-submit"
                hx-post="/auth/signup/"
                hx-target="#error-message"
                hx-swap="innerHTML"
        >
            Sign Up
        </button>
    </form>

    <a href="{{ url_for('get_signin') }}" class="switch-link">
        Already have an account? Log in!
    </a>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='js/password-toggle.js') }}"></script>
{% endblock %}
